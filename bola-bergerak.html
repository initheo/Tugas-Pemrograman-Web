<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bola Bergerak</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #canvas {
        width: 700px;
        height: 400px;
        background-color: green;
        position: relative;
      }

      @keyframes gerakin {
        0% {
          left: 0;
          top: calc(50% - 25px);
          opacity: 0;
          transform: none;
        }
        5% {
          left: 0;
          top: calc(50% - 25px);
          opacity: 1;
          transform: none;
        }
        35% {
          left: calc(100% - 50px);
          top: calc(50% - 25px);
          opacity: 1;
          transform: none;
        }
        45% {
          left: calc(100% - 50px);
          top: calc(100% - 50px);
          opacity: 1;
          transform: none;
        }
        95% {
          left: 0;
          top: calc(100% - 50px);
          opacity: 1;
          transform: none;
        }
        100% {
          left: 0;
          top: calc(100% - 50px);
          opacity: 0;
          transform: none;
        }
      }

      #bola {
        width: 50px;
        height: 50px;
        background-color: white;
        border-radius: 50%;
        position: absolute;
        animation: gerakin 6s linear forwards;
      }
    </style>
  </head>
  <body>
    <div id="canvas">
      <div id="bola"></div>
    </div>
  </body>
</html>
