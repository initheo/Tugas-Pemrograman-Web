<!DOCTYPE html>
<html lang="en">
<head>

    <title>Kalender</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>

            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .canvas {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            width: 40px;
        }

        th {
            background-color: rgb(1,123,254);
            color: white;
        }

        #header {

            align-items: center;
            margin-bottom: 10px;
        }

        #hariini {

            color: white;
        }

        i {
            margin: 0 10px;
            color: white;
            padding: 5px;
            background-color: rgb(1,123,254);
        }

        .bi {
            cursor: pointer;
            font-size: 1.2rem;
        }
    </style>
</head>
