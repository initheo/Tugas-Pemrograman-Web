<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
      }

      .canvas {
        width: 700px;
        height: 400px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .jam {
        color: green;
      }

      .menit {
        color: red;
      }

      p {
        font-size: 55px;
        font-weight: bold;
        margin-top: -40px;
        margin-bottom: 30px;
      }

      button {
        padding: 10px 12px;
        margin: 1px;
        border: none;
        cursor: pointer;
        font-size: 15px;
        color: white;
        transition: opacity 0.2s;
      }

      .mulai {
        background-color: green;
      }

      .berhenti {
        background-color: yellow;
        color: black;
      }

      .reset {
        background-color: #f44336;
      }

      .button-container {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <p><span class="jam">000</span>:<span class="menit">00</span></p>
      <div class="button-container">
        <button class="mulai">Start Timer</button>
        <button class="berhenti">Stop Timer</button>
        <button class="reset">Reset Timer</button>
      </div>
    </div>
  </body>
</html>
